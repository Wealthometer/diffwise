description: Passwords hashed with unsalted MD5.
files:
  - path: src/users.ts
    patch: |
      @@ -1,4 +1,8 @@
       import crypto from "node:crypto"
       
      +export function hashPassword(password: string) {
      +  return crypto.createHash("md5").update(password).digest("hex")
      +}
      +
expected:
  - path: src/users.ts
    on_any_line_containing:
      - "createHash(\"md5\")"
    category: security
