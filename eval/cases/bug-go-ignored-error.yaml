description: Error from reading the config file is discarded; a missing file silently yields empty config.
files:
  - path: internal/config/load.go
    patch: |
      @@ -14,6 +14,11 @@ type Config struct {
       
       func Load(path string) (*Config, error) {
      -	return defaults(), nil
      +	data, _ := os.ReadFile(path)
      +	var cfg Config
      +	if err := json.Unmarshal(data, &cfg); err != nil {
      +		return nil, err
      +	}
      +	return &cfg, nil
       }
expected:
  - path: internal/config/load.go
    on_any_line_containing:
      - "data, _ := os.ReadFile"
    category: reliability
